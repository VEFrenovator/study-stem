<!DOCTYPE html>

<html lang="en">

    <head>
        <!-- Charset & Viewport meta -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Title, description -->
        <title>A digital garden of math, computer science, 3D modeling, electronics, and curious ideas</title>
        <meta name="description"
            content="A digital garden of math, computer science, 3D modeling, electronics, and curious ideas">

        <!-- Favicon -->
        <link rel="icon" href="docs/_media/favicon.ico" type="image/x-icon">

        <!-- Main Docsify CSS theme -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">

        <!-- Vue Theme (add-on) -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">

        <!-- Core Dark (add-on) -->
        <link id="theme-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css"
            media="(prefers-color-scheme: dark)">

        <!-- KaTeX CSS for math formulas (add-on) -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
        <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>

        <!-- Material Icons (add-on) -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp"
            rel="stylesheet" />
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=dark_mode,language,light_mode" />

        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-0JXMBSC6CT"></script>
        <script src="//unpkg.com/docsify-material-icons/dist/docsify-material-icons.min.js"></script>
        
        <!-- My styles & scripts -->
        <link rel="stylesheet" href="static/styles.css">
        <script src="static/scripts.js"></script>

    </head>

    <body class="loading sidebar-chevron-right sidebar-group-box sidebar-toggle-chevron">
        <!-- Navbar -->
        <nav id="navbar">
            <ul>
                <li><button id="change-theme"><span id="theme-icon" class="material-symbols-outlined">light_mode</span></button></li>
                <li>
                    <span class="material-symbols-outlined">language</span>
                    <ul>
                        <li><a href="#/">EN</a></li>
                        <li><a href="https://github.com/VEFrenovator/study-stem/issues/new">Request to add a translation</a></li>
                    </ul>
                </li>
            </ul>
        </nav>

        <!-- App -->
        <div id="app"></div>

        <!-- Cookies -->
        <div id="cookie-banner">
            <div class="cookie-banner-description">
                This site uses Google Analytics to analyze traffic. You can read more in the <a href="#/privacy_policy"
                    class="cookie-banner-link">Privacy Policy</a>.
            </div>
            <div class="cookie-banner-actions">
                <button id="reject-cookies" type="button">Reject</button>
                <button id="accept-cookies" type="button">Accept</button>
            </div>
        </div>

        <!-- Main Docsify script -->
        <script src="https://cdn.jsdelivr.net/npm/docsify@5"></script>

        <!-- KaTeX Plugin for Math -->
        <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>

    </body>

</html>
